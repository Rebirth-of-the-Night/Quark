plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version "${forge_gradle_version}"
    id 'org.spongepowered.mixin' version "${mixin_gradle_version}"
    id 'wtf.gofancy.fancygradle' version "${fancy_gradle_version}"
}

version = mod_version
group = 'vazkii.quark'
base.archivesName = file_name

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

sourceSets {
    api
    main.compileClasspath += api.output
}

configurations {
    apiCompileOnly.extendsFrom minecraft
}

minecraft {
    mappings channel: mappings_channel, version: mappings_version

    accessTransformer = file('src/main/resources/META-INF/quark_at.cfg')

    runs {
        client {
            args "--username=InDev"

            jvmArg "-Dfml.coreMods.load=${coremod_class}"
            jvmArg "-Dmixin.checks.interfaces=true"
            jvmArg "-Dmixin.debug.export=true"

            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            jvmArg "-Dfml.coreMods.load=${coremod_class}"
            jvmArg "-Dmixin.checks.interfaces=true"
            jvmArg "-Dmixin.debug.export=true"

            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly "org.spongepowered:mixin:${mixin_version}"
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
    compileOnly "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"

    // provides mixin + mixinextras in dev. remove to test the legacy asm patches
    runtimeOnly fg.deobf("curse.maven:fermiumbooter-${fermiumbooter_version}")

    implementation fg.deobf("curse.maven:autoreglib-${autoreglib_version}")
    implementation fg.deobf("curse.maven:jei-${jei_version}")
    compileOnly fg.deobf("curse.maven:baubles-${baubles_version}")
    compileOnly fg.deobf("curse.maven:renderlib-${renderlib_version}")
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
}

fancyGradle {
    patches {
        resources
        coremods
        asm
        mergetool
    }
}

def modProperties = [
        'modid': mod_id,
        'name': mod_name,
        'version': mod_version
]

tasks.register('generateTags', Copy) {
    inputs.properties modProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/tags')
    expand modProperties
}

sourceSets.main.java.srcDir(tasks.named('generateTags'))

processResources {
    var replaceProperties = modProperties + ['mcversion': minecraft_version]

    inputs.properties replaceProperties

    filesMatching('mcmod.info') {
        expand replaceProperties
    }

    exclude '**/psd/**'
}

jar {
    exclude "**/*.bat"
    exclude "**/*.psd"
    exclude "**/*.exe"
    exclude "**/unused"

    manifest {
        attributes([
            "FMLCorePlugin": coremod_class,
            "FMLCorePluginContainsFMLMod": "true",
            "FMLAT": "quark_at.cfg"
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.register('sourcesJar', Jar) {
    from sourceSets.main.java
    archiveClassifier = 'sources'
}

tasks.register('apiJar', Jar) {
    from sourceSets.main.allJava
    from sourceSets.main.output
    include 'vazkii/quark/api/**'
    archiveClassifier = 'api'
}

tasks.named('assemble') {
    dependsOn 'sourcesJar', 'apiJar'
}
